<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Events Bridge — Status</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f5; color: #1a1f1c; margin: 0; padding: 20px; }
  h1 { color: #0b5c3c; font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: white; border: 1px solid #d8ddd9; border-radius: 10px; padding: 14px; }
  .stat .label { font-size: 12px; color: #667066; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .stat.ok .value { color: #0b5c3c; }
  .stat.err .value { color: #b3261e; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  th, td { text-align: left; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #eee; }
  th { background: #eef2ef; color: #445; }
  .status-ok { color: #0b5c3c; font-weight: 700; }
  .status-error { color: #b3261e; font-weight: 700; }
  .status-pending { color: #c99a2e; font-weight: 700; }
  .empty { color: #888; font-style: italic; padding: 10px; }
  .refresh-note { font-size: 12px; color: #888; margin-bottom: 14px; }
</style>
</head>
<body>
  <h1>Field Events Bridge — Live Status</h1>
  <div class="refresh-note">Auto-refreshes every 5 seconds. Keep this page open on the timing laptop during the event.</div>

  <div class="grid" id="stats"></div>

  <h3>Recent Submissions</h3>
  <div id="submissions"></div>

  <h3>Recent Errors</h3>
  <div id="errors"></div>

<script>
async function refresh() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    if (!data.success) return;

    const uptimeMin = Math.floor(data.uptimeSeconds / 60);
    document.getElementById('stats').innerHTML = `
      <div class="stat ok"><div class="label">Server Uptime</div><div class="value">${uptimeMin}m</div></div>
      <div class="stat ok"><div class="label">Total Submissions</div><div class="value">${data.recentSubmissions.length}</div></div>
      <div class="stat ${data.recentErrors.length > 0 ? 'err' : 'ok'}"><div class="label">Recent Errors</div><div class="value">${data.recentErrors.length}</div></div>
      <div class="stat ok"><div class="label">Watching Folder</div><div class="value" style="font-size:11px;word-break:break-all;">${data.dataDir}</div></div>
    `;

    const subs = data.recentSubmissions;
    document.getElementById('submissions').innerHTML = subs.length === 0
      ? '<div class="empty">No submissions yet.</div>'
      : `<table><tr><th>Time</th><th>Event</th><th>Flight</th><th>Official</th><th>File</th><th>Status</th></tr>` +
        subs.map(s => `<tr>
          <td>${new Date(s.submitted_at).toLocaleTimeString()}</td>
          <td>${s.event_name || s.event_id}</td>
          <td>${s.flight_id}</td>
          <td>${s.official_name || '—'}${s.official_phone ? ' (' + s.official_phone + ')' : ''}</td>
          <td>${s.lif_filename || '—'}</td>
          <td class="${s.write_status === 'ok' ? 'status-ok' : s.write_status === 'pending' ? 'status-pending' : 'status-error'}">${s.write_status.toUpperCase()}${s.error_message ? ': ' + s.error_message : ''}</td>
        </tr>`).join('') + `</table>`;

    const errs = data.recentErrors;
    document.getElementById('errors').innerHTML = errs.length === 0
      ? '<div class="empty">No errors logged. Good.</div>'
      : `<table><tr><th>Time</th><th>Context</th><th>Message</th></tr>` +
        errs.map(e => `<tr>
          <td>${new Date(e.occurred_at).toLocaleTimeString()}</td>
          <td>${e.context}</td>
          <td>${e.message}</td>
        </tr>`).join('') + `</table>`;
  } catch (err) {
    console.error('Status refresh failed', err);
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
