<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Field Events Entry</title>
<style>
  :root {
    --primary: #0b5c3c;
    --primary-dark: #063d28;
    --accent: #c99a2e;
    --danger: #b3261e;
    --bg: #f4f6f5;
    --card: #ffffff;
    --border: #d8ddd9;
    --text: #1a1f1c;
    --muted: #667066;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 100px;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 16px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .sub { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .container { padding: 14px; max-width: 640px; margin: 0 auto; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  select, input[type=password], input[type=text] {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: white;
    margin-bottom: 12px;
  }
  select:focus, input:focus { outline: none; border-color: var(--primary); }

  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    cursor: pointer;
  }
  .btn:active { background: var(--primary-dark); }
  .btn.secondary { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn:disabled { background: #aab3ae; cursor: not-allowed; }

  .athlete-row {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fbfcfb;
  }
  .athlete-row .name { font-weight: 700; font-size: 15px; }
  .athlete-row .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .attempts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .attempts input {
    margin: 0;
    padding: 10px 6px;
    text-align: center;
    font-size: 15px;
  }
  .attempt-label { font-size: 10.5px; text-align: center; color: var(--muted); margin-bottom: 2px; }

  .banner {
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 14px;
    display: none;
  }
  .banner.error { background: #fdecea; color: var(--danger); border: 1px solid #f3c7c3; display: block; }
  .banner.success { background: #e7f5ec; color: var(--primary-dark); border: 1px solid #b9e0c9; display: block; }
  .banner.info { background: #eef2ff; color: #3949ab; border: 1px solid #c5cef2; display: block; }

  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .foul-codes { font-size: 11.5px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .lock-screen { text-align: center; padding: 60px 20px; }
  .lock-screen h2 { color: var(--primary); }
</style>
</head>
<body>

<header>
  <h1>Field Events — Entry</h1>
  <div class="sub" id="header-sub">Enter access PIN to begin</div>
</header>

<div class="container">

  <div id="lock-screen" class="card lock-screen">
    <h2>🔒 Field Judge Sign-In</h2>
    <p class="hint">Ask your Meet Manager for today's PIN.</p>
    <label style="text-align:left;">Your Name (required)</label>
    <input type="text" id="official-name-input" placeholder="e.g. Ramesh Kumar" autocomplete="name">
    <label style="text-align:left;">Your Phone (optional, in case we need to reach you)</label>
    <input type="text" id="official-phone-input" placeholder="e.g. 98765 43210" inputmode="tel" autocomplete="tel">
    <label style="text-align:left;">Access PIN</label>
    <input type="password" id="pin-input" placeholder="Access PIN" inputmode="numeric">
    <button class="btn" id="unlock-btn" onclick="checkPin()">Unlock</button>
    <div id="pin-error" class="banner error"></div>
  </div>

  <div id="main-screen" style="display:none;">
    <div id="banner" class="banner"></div>

    <div class="card">
      <label>Select Event / Flight</label>
      <select id="event-select" onchange="loadEvent()">
        <option value="">Loading events…</option>
      </select>
      <button class="btn secondary" onclick="fetchEvents()" style="margin-top:4px;">↻ Refresh event list</button>
    </div>

    <div id="athletes-container"></div>

    <div id="submit-container" style="display:none;">
      <button class="btn" id="submit-btn" onclick="submitResults()">Submit Results</button>
      <div class="foul-codes" id="codes-hint">
        <strong>Valid codes instead of a mark:</strong> X = foul/no-mark &nbsp; P = pass &nbsp; NM = no mark &nbsp; R = retired &nbsp; DQ = disqualified
      </div>
    </div>
  </div>
</div>

<script>
let PIN = '';
let OFFICIAL_NAME = '';
let OFFICIAL_PHONE = '';
let currentEvents = [];
let currentEvent = null;

async function checkPin() {
  const pin = document.getElementById('pin-input').value.trim();
  const name = document.getElementById('official-name-input').value.trim();
  const phone = document.getElementById('official-phone-input').value.trim();
  const errEl = document.getElementById('pin-error');
  errEl.style.display = 'none';

  if (!name) { errEl.textContent = 'Enter your name — required so we know who to contact about your entries.'; errEl.style.display = 'block'; return; }
  if (!pin) { errEl.textContent = 'Enter the access PIN.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('unlock-btn');
  btn.disabled = true; btn.textContent = 'Checking…';

  try {
    // The PIN is actually verified against the server here — it used to
    // only be stored locally and checked for the first time at submit,
    // which meant a wrong PIN still "unlocked" the event list on the phone.
    const res = await fetch('/api/events', { headers: { 'x-access-pin': pin } });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error || 'Invalid PIN');

    PIN = pin;
    OFFICIAL_NAME = name;
    OFFICIAL_PHONE = phone;
    currentEvents = data.events;
    populateEventSelect();

    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    document.getElementById('header-sub').textContent = (data.official && data.official.role)
      ? `${name} — ${data.official.role}`
      : `${name} — Connected`;
  } catch (err) {
    errEl.textContent = 'Could not unlock: ' + err.message;
    errEl.style.display = 'block';
    PIN = '';
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

function showBanner(msg, type) {
  const b = document.getElementById('banner');
  b.className = 'banner ' + type;
  b.textContent = msg;
  if (type !== 'error') setTimeout(() => { b.style.display = 'none'; }, 5000);
}

function populateEventSelect() {
  const sel = document.getElementById('event-select');
  if (currentEvents.length === 0) {
    sel.innerHTML = '<option value="">No events assigned to your PIN yet</option>';
    showBanner('No field events found for your access PIN. Ask the Meet Manager to export the schedule from EMM, or check you have the right PIN for your team.', 'info');
    return;
  }
  sel.innerHTML = '<option value="">— Select an event/flight —</option>' +
    currentEvents.map((e, idx) =>
      `<option value="${idx}">${e.eventName} — Flight ${e.flightId} (${e.athletes.length} athletes)</option>`
    ).join('');
}

// Re-checks the PIN with the server (not just re-reads the local schedule) —
// used by the "Refresh" button so a revoked/changed PIN is caught mid-session.
async function fetchEvents() {
  const sel = document.getElementById('event-select');
  sel.innerHTML = '<option value="">Loading…</option>';
  try {
    const res = await fetch('/api/events', { headers: { 'x-access-pin': PIN } });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error);
    currentEvents = data.events;
    populateEventSelect();
  } catch (err) {
    sel.innerHTML = '<option value="">Error loading events</option>';
    if (err.message.toLowerCase().includes('pin')) {
      // PIN no longer valid (changed by Meet Manager, etc.) — re-lock rather
      // than leave a stale event list on screen.
      document.getElementById('main-screen').style.display = 'none';
      document.getElementById('lock-screen').style.display = 'block';
      document.getElementById('pin-error').textContent = 'Your PIN is no longer valid — enter it again.';
      document.getElementById('pin-error').style.display = 'block';
    } else {
      showBanner('Could not load events: ' + err.message, 'error');
    }
  }
}

// Mirrors fieldEvent.js's classifyEventCode — keep both in sync if the
// event-code prefixes ever change.
function classifyEventCode(eventCode) {
  if (!eventCode) return 'unknown';
  const prefix = eventCode.replace(/[0-9]+$/, '').toUpperCase();
  if (['HJ', 'PV'].includes(prefix)) return 'vertical_jump';
  if (['LJ', 'TJ'].includes(prefix)) return 'horizontal_jump';
  if (['SP', 'DT', 'HT', 'JT'].includes(prefix)) return 'throw';
  return 'unknown';
}

let verticalHeights = []; // shared bar-height sequence for the current vertical jump event

function loadEvent() {
  const idx = document.getElementById('event-select').value;
  const container = document.getElementById('athletes-container');
  const submitContainer = document.getElementById('submit-container');
  if (idx === '') {
    container.innerHTML = '';
    submitContainer.style.display = 'none';
    return;
  }
  currentEvent = currentEvents[idx];
  const eventType = classifyEventCode(currentEvent.eventCode);

  const codesHint = document.getElementById('codes-hint');
  if (eventType === 'vertical_jump') {
    verticalHeights = [];
    renderVerticalJumpUI(container);
    codesHint.innerHTML = '<strong>Per attempt at a height:</strong> O = clear &nbsp; X = fail &nbsp; P = pass &nbsp; — enter up to 3 in order, e.g. "XO" or "XXX". &nbsp; To disqualify an athlete, type <strong>DQ</strong> in any one of their height boxes instead.';
  } else if (eventType === 'horizontal_jump') {
    renderAttemptGridUI(container, true);
    codesHint.innerHTML = '<strong>Valid codes instead of a mark:</strong> X = foul/no-mark &nbsp; P = pass &nbsp; NM = no mark &nbsp; R = retired &nbsp; DQ = disqualified (type in any one attempt box). &nbsp; <strong>Wind</strong> is the small box under each mark — enter the reading with its sign, e.g. "+1.2" or "-0.3"; leave blank if not measured.';
  } else {
    renderAttemptGridUI(container, false);
    codesHint.innerHTML = '<strong>Valid codes instead of a mark:</strong> X = foul/no-mark &nbsp; P = pass &nbsp; NM = no mark &nbsp; R = retired &nbsp; DQ = disqualified (type in any one attempt box)';
  }
  submitContainer.style.display = 'block';
  showLastSubmissionBanner();
}

// Lets a judge see if a colleague already submitted this flight, and when —
// doesn't block a resubmission (a real correction is legitimate), just
// makes it visible so two officials don't unknowingly overwrite each other.
async function showLastSubmissionBanner() {
  if (!currentEvent) return;
  try {
    const params = new URLSearchParams({ eventId: currentEvent.eventId, roundId: currentEvent.roundId, flightId: currentEvent.flightId });
    const res = await fetch('/api/last-submission?' + params.toString(), { headers: { 'x-access-pin': PIN } });
    const data = await res.json();
    if (data.success && data.last) {
      const when = new Date(data.last.submittedAt).toLocaleTimeString();
      showBanner(`Already submitted by ${data.last.officialName || 'someone'} at ${when}. Submitting again will overwrite it.`, 'info');
    }
  } catch (err) {
    // Non-critical — don't block the judge over this check failing.
  }
}

// --- Horizontal jumps & throws: fixed 6-attempt numeric grid.
//     showWind=true adds a small wind-reading box under each mark — only
//     for Long Jump/Triple Jump, since throws don't carry a wind column. ---
function renderAttemptGridUI(container, showWind) {
  container.innerHTML = currentEvent.athletes.map((a) => `
    <div class="card athlete-row" data-bib="${a.bib}" data-order="${a.order}" data-last="${a.lastName}" data-first="${a.firstName}" data-team="${a.team}">
      <div class="name">${a.firstName} ${a.lastName} <span style="color:#888;font-weight:400;">— #${a.bib}</span></div>
      <div class="meta">${a.team}</div>
      <div class="attempts">
        ${[1,2,3,4,5,6].map(n => `
          <div>
            <div class="attempt-label">Attempt ${n}</div>
            <input type="text" class="attempt-input" data-idx="${n-1}" autocomplete="off" placeholder="—">
            ${showWind ? `<input type="text" class="wind-input" data-idx="${n-1}" autocomplete="off" placeholder="wind" style="margin-top:4px;font-size:12px;padding:6px;">` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

// --- Vertical jumps (High Jump / Pole Vault): height-by-height entry ---
function renderVerticalJumpUI(container) {
  container.innerHTML = `
    <div class="card">
      <label>Bar Heights (in order raised, e.g. 1.50, 1.55, 1.60)</label>
      <div id="heights-list" style="margin-bottom:10px;"></div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="new-height-input" placeholder="e.g. 1.65" inputmode="decimal" style="margin-bottom:0;">
        <button class="btn secondary" style="width:auto; padding:14px 18px;" onclick="addHeight()">+ Add</button>
      </div>
    </div>
    <div id="height-athletes"></div>
  `;
  renderHeightsList();
  renderHeightAthletes();
}

function renderHeightsList() {
  const el = document.getElementById('heights-list');
  el.innerHTML = verticalHeights.length === 0
    ? '<div class="hint">No heights added yet — add the opening height below.</div>'
    : verticalHeights.map((h, i) => `<span style="display:inline-block;background:#eef2ef;border-radius:6px;padding:4px 10px;margin:2px;font-weight:600;">${h}</span>`).join('');
}

function addHeight() {
  const input = document.getElementById('new-height-input');
  const val = input.value.trim();
  if (!val || isNaN(parseFloat(val))) { showBanner('Enter a valid height, e.g. 1.65', 'error'); return; }
  if (verticalHeights.includes(val)) { showBanner('That height is already added.', 'error'); return; }
  verticalHeights.push(val);
  input.value = '';
  renderHeightsList();
  renderHeightAthletes();
}

function renderHeightAthletes() {
  const container = document.getElementById('height-athletes');
  if (verticalHeights.length === 0) { container.innerHTML = ''; return; }

  container.innerHTML = currentEvent.athletes.map((a) => `
    <div class="card athlete-row-vertical" data-bib="${a.bib}" data-order="${a.order}" data-last="${a.lastName}" data-first="${a.firstName}" data-team="${a.team}">
      <div class="name">${a.firstName} ${a.lastName} <span style="color:#888;font-weight:400;">— #${a.bib}</span></div>
      <div class="meta">${a.team}</div>
      <div class="attempts" style="grid-template-columns: repeat(${Math.min(verticalHeights.length, 4)}, 1fr);">
        ${verticalHeights.map(h => `
          <div>
            <div class="attempt-label">${h}m</div>
            <input type="text" class="height-attempt-input" data-height="${h}" autocomplete="off" placeholder="O/X/P" maxlength="3" style="text-transform:uppercase;">
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

async function submitResults() {
  if (!currentEvent) return;
  const eventType = classifyEventCode(currentEvent.eventCode);
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try {
    let body;

    if (eventType === 'vertical_jump') {
      if (verticalHeights.length === 0) throw new Error('Add at least one height before submitting.');
      const rows = document.querySelectorAll('.athlete-row-vertical');
      const results = Array.from(rows).map(row => {
        const attemptsByHeight = {};
        row.querySelectorAll('.height-attempt-input').forEach(input => {
          const v = input.value.trim().toUpperCase();
          if (v) attemptsByHeight[input.dataset.height] = v;
        });
        return {
          bib: row.dataset.bib, order: row.dataset.order,
          lastName: row.dataset.last, firstName: row.dataset.first, team: row.dataset.team,
          attemptsByHeight,
        };
      });
      body = {
        eventId: currentEvent.eventId, roundId: currentEvent.roundId, flightId: currentEvent.flightId,
        eventName: currentEvent.eventName, heights: verticalHeights, results,
      };
    } else {
      const rows = document.querySelectorAll('.athlete-row');
      const results = Array.from(rows).map(row => {
        const attempts = Array.from(row.querySelectorAll('.attempt-input')).map(i => i.value.trim());
        const windInputs = row.querySelectorAll('.wind-input');
        const winds = windInputs.length > 0 ? Array.from(windInputs).map(i => i.value.trim()) : undefined;
        return {
          bib: row.dataset.bib, order: row.dataset.order,
          lastName: row.dataset.last, firstName: row.dataset.first, team: row.dataset.team,
          attempts, winds,
        };
      });
      body = {
        eventId: currentEvent.eventId, roundId: currentEvent.roundId, flightId: currentEvent.flightId,
        eventName: currentEvent.eventName, results,
      };
    }

    body.officialName = OFFICIAL_NAME;
    body.officialPhone = OFFICIAL_PHONE;

    const res = await fetch('/api/save-lif', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-access-pin': PIN },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    if (data.status === 'pending' && data.submissionId) {
      // Came back through the CLOUD RELAY (mobile data) — the relay only
      // queued it, the timing laptop hasn't actually processed it yet.
      // Poll for the real result instead of claiming success too early.
      btn.textContent = 'Waiting for laptop to confirm…';
      showBanner('Submitted over mobile data — waiting for the timing laptop to confirm…', 'info');
      await pollSubmissionStatus(data.submissionId);
    } else {
      // Local Wi-Fi/hotspot path — this response IS the final result already.
      showBanner('Saved: ' + data.file + ' — results sent to Easy Meet Manager.', 'success');
    }
  } catch (err) {
    showBanner('Submit failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Results';
  }
}

// Polls the cloud relay for the laptop's real verdict on a queued
// submission. Only used on the mobile-data path — local submissions get
// their answer immediately in the original request.
async function pollSubmissionStatus(submissionId) {
  const maxAttempts = 15; // ~30s at 2s intervals
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    await new Promise((r) => setTimeout(r, 2000));
    try {
      const res = await fetch('/api/status/' + submissionId, { headers: { 'x-access-pin': PIN } });
      const data = await res.json();
      if (!data.success) continue;
      if (data.status === 'processed' && data.result) {
        showBanner('Saved: ' + data.result.file + ' — confirmed by the timing laptop.', 'success');
        return;
      }
      if (data.status === 'error' && data.result) {
        showBanner('Rejected by the timing laptop: ' + data.result.error, 'error');
        return;
      }
      // still 'pending' or 'processing' — keep waiting
    } catch (err) {
      // transient network hiccup on mobile data — keep trying
    }
  }
  showBanner('Still waiting for the laptop to come back online — your entry is queued and will be picked up automatically once it does. Check the status dashboard or ask the Meet Manager if this takes longer than a minute.', 'info');
}
</script>
</body>
</html>
